<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>In Search of Pink</title>
<meta name="description" content="Which Fort Lauderdale restaurants have Sweet'N Low in the sugar caddy">
<meta name="theme-color" content="#FBF5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171214" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pink List">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Shrikhand&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
/* Layout: one-screen phone app. Masthead scrolls away; search + filter bar stays pinned; each restaurant row wears a crimped sugar-packet badge; adding and correcting happen in a bottom sheet. */
:root {
  --bg: #FBF5F7;
  --surface: #FFFFFF;
  --ink: #2A1F24;
  --muted: #74636B;
  --line: #EADCE2;
  --pink: #CF2F7B;
  --on-pink: #FFFFFF;
  --pink-soft: #FBE1EC;
  --pink-ink: #8C1450;
  --no: #56616B;
  --no-soft: #E9EDF0;
  --unk-a: #F3ECEF;
  --unk-b: #DCCFD5;
  --ok: #23845A;
  --warn: #B86A00;
  --scrim: rgba(42, 31, 36, 0.45);
  --shadow: 0 12px 32px rgba(120, 30, 70, 0.20);
  --f-display: "Shrikhand", "Cooper Black", Georgia, serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --tooth: 4px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171214; --surface: #231A1F; --ink: #F5EAEF; --muted: #B4A2AA; --line: #3A2C33;
    --pink: #FF62A5; --on-pink: #2A0716; --pink-soft: #4A1C31; --pink-ink: #FFC1DA;
    --no: #B2BCC5; --no-soft: #2C3237; --unk-a: #2A2125; --unk-b: #45363D;
    --ok: #5ED39C; --warn: #F2A93B;
    --scrim: rgba(0, 0, 0, 0.6); --shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171214; --surface: #231A1F; --ink: #F5EAEF; --muted: #B4A2AA; --line: #3A2C33;
  --pink: #FF62A5; --on-pink: #2A0716; --pink-soft: #4A1C31; --pink-ink: #FFC1DA;
  --no: #B2BCC5; --no-soft: #2C3237; --unk-a: #2A2125; --unk-b: #45363D;
  --ok: #5ED39C; --warn: #F2A93B;
  --scrim: rgba(0, 0, 0, 0.6); --shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 17px/1.45 var(--f-body);
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }

.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Masthead */
.masthead { padding-block: 20px 6px; display: flex; align-items: flex-start; gap: 12px; }
.brand { margin: 0; flex: 1; min-width: 0; line-height: 1; }
.brand small {
  display: block; font: 700 12px/1 var(--f-body); letter-spacing: 0.22em;
  text-transform: uppercase; color: var(--muted); margin-bottom: 4px;
}
.brand span {
  display: block; font-family: var(--f-display); font-weight: 400; font-size: 52px;
  line-height: 1.05; color: var(--pink); letter-spacing: 0.01em;
}
.sub { margin: 6px 0 0; color: var(--muted); font-size: 15px; text-wrap: balance; }
.icon-btn {
  flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--surface); display: grid; place-items: center; margin-top: 4px;
}
.icon-btn svg { width: 22px; height: 22px; fill: var(--ink); }

/* Sharing status */
.status-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.status-row:not(:has(button:not([hidden]))) { display: none; }
.sync-line {
  display: inline-flex; align-items: center; gap: 8px; min-height: 34px; max-width: 100%;
  padding: 5px 13px 5px 11px; border-radius: 17px; border: 1px solid var(--line);
  background: var(--surface); color: var(--muted); font-size: 14px; text-align: left;
}
.sync-line #syncText { min-width: 0; }
.sync-line .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--muted); }
.sync-line[data-state="off"] { border-style: dashed; }
.sync-line[data-state="ok"] .dot { background: var(--ok); }
.sync-line[data-state="busy"] .dot { background: var(--pink); animation: pulse 0.9s ease-in-out infinite alternate; }
.sync-line[data-state="offline"] .dot, .sync-line[data-state="error"] .dot { background: var(--warn); }
.install-pill {
  min-height: 34px; padding: 5px 14px; border-radius: 17px; border: 2px solid var(--pink);
  background: transparent; color: var(--pink-ink); font-size: 14px; font-weight: 700;
}
@keyframes pulse { from { opacity: 1; } to { opacity: 0.3; } }

/* Where are we? */
.here {
  margin-top: 14px; padding: 14px 16px 10px; border-radius: 18px;
  background: var(--surface); border: 1px solid var(--line);
  display: grid; gap: 8px;
}
.here[data-kind="pink"] { background: var(--pink); border-color: var(--pink); color: var(--on-pink); }
.here[data-kind="no"] { background: var(--no-soft); border-color: var(--no-soft); }
.here[data-kind="unknown"] { border: 2px dashed var(--unk-b); }
.here[data-kind="quiet"] { background: transparent; border-style: dashed; padding-block: 8px 4px; }
.here[data-kind="locating"] { padding-bottom: 14px; }
.here-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 28px; }
.eyebrow {
  display: inline-flex; align-items: center; gap: 6px; min-width: 0;
  font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
}
.pin { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linejoin: round; }
.here[data-kind="locating"] .pin { color: var(--pink); animation: bob 0.8s ease-in-out infinite alternate; }
.here[data-kind="pink"] .eyebrow, .here[data-kind="pink"] .here-link, .here[data-kind="pink"] .here-text { color: var(--on-pink); }
.here-name { margin: 0; font-size: 30px; font-weight: 700; line-height: 1.1; overflow-wrap: anywhere; text-wrap: balance; }
.here-title { margin: 0; font-size: 18px; font-weight: 700; line-height: 1.3; text-wrap: balance; }
.here-text { margin: 0; font-size: 15px; color: var(--muted); }
.here-text b { color: var(--ink); overflow-wrap: anywhere; }
.verdict { display: flex; align-items: center; gap: 12px; font-family: var(--f-display); font-size: 23px; line-height: 1.15; }
.verdict .packet { height: 34px; min-width: 70px; font-size: 14px; }
.here[data-kind="pink"] .packet.pink { background: var(--on-pink); color: var(--pink); }
.here[data-kind="no"] .packet.no { background: var(--surface); }
.here-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 18px; }
.here-link {
  border: 0; background: transparent; padding: 6px 0; min-height: 40px;
  color: var(--pink-ink); font-weight: 700; font-size: 15px; text-decoration: underline; text-underline-offset: 3px;
}
.here-top .here-link { min-height: 32px; padding: 0; flex: none; }
.here .btn .pin { width: 20px; height: 20px; }
.btn.small { height: 42px; padding: 0 16px; font-size: 15px; }
.quick { display: flex; gap: 10px; }
.quick .btn { flex: 1; padding: 0 12px; }
.here-list { list-style: none; margin: 0; padding: 0; }
.here-list li + li { border-top: 1px solid var(--line); }
.here-list .row { min-height: 52px; padding: 8px 0; }
@keyframes bob { from { transform: translateY(0); } to { transform: translateY(-3px); } }

/* Pinned search bar */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); padding-block: 12px 10px; border-bottom: 1px solid var(--line);
}
.search {
  display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 8px 0 16px;
  background: var(--surface); border: 2px solid var(--line); border-radius: 14px;
}
.search:focus-within { border-color: var(--pink); }
.search > svg { width: 22px; height: 22px; flex: none; fill: none; stroke: var(--muted); stroke-width: 2.4; stroke-linecap: round; }
.search input {
  flex: 1; min-width: 0; border: 0; background: transparent; font-size: 19px; height: 100%;
  outline: none;
}
.search input::placeholder { color: var(--muted); }
.search input::-webkit-search-cancel-button { display: none; }
.clear {
  flex: none; width: 40px; height: 40px; border: 0; border-radius: 50%;
  background: var(--no-soft); color: var(--no); font-size: 22px; line-height: 1;
}
.filters {
  display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; scrollbar-width: none;
  padding-bottom: 2px;
}
.filters::-webkit-scrollbar { display: none; }
.chip {
  flex: none; height: 38px; padding: 0 11px; border-radius: 19px; border: 1px solid var(--line);
  background: var(--surface); font-size: 14.5px; display: inline-flex; align-items: center; gap: 6px;
  white-space: nowrap;
}
.chip b { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip[aria-pressed="true"] b { color: var(--bg); opacity: 0.75; }

/* The packet badge */
.packet {
  display: inline-grid; place-items: center; flex: none;
  min-width: 64px; height: 30px; padding: 0 14px;
  font: 700 13px/1 var(--f-body); letter-spacing: 0.1em; text-transform: uppercase;
  clip-path: polygon(var(--tooth) 0, calc(100% - var(--tooth)) 0, 100% 16.66%, calc(100% - var(--tooth)) 33.33%, 100% 50%, calc(100% - var(--tooth)) 66.66%, 100% 83.33%, calc(100% - var(--tooth)) 100%, var(--tooth) 100%, 0 83.33%, var(--tooth) 66.66%, 0 50%, var(--tooth) 33.33%, 0 16.66%);
}
.packet.pink { background: var(--pink); color: var(--on-pink); }
.packet.no { background: var(--no-soft); color: var(--no); }
.packet.unknown {
  background: repeating-linear-gradient(135deg, var(--unk-a) 0 5px, var(--unk-b) 5px 7px);
  color: var(--ink); font-size: 16px; letter-spacing: 0;
}

/* List */
main { padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)); }
.list { list-style: none; margin: 0; padding: 0; }
.list li + li { border-top: 1px solid var(--line); }
.row {
  width: 100%; display: flex; align-items: center; gap: 12px; min-height: 60px;
  padding: 10px 4px; border: 0; background: transparent; text-align: left;
}
.row:active { background: var(--pink-soft); }
.row .name { flex: 1; min-width: 0; font-size: 19px; overflow-wrap: anywhere; }
.row .name mark { background: transparent; color: inherit; font-weight: 700; text-decoration: underline; text-decoration-color: var(--pink); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.empty { padding-block: 36px 12px; text-align: center; color: var(--muted); }
.empty p { margin: 0 0 16px; text-wrap: balance; }
.empty strong { color: var(--ink); }
.notice {
  margin: 12px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--pink-soft);
  color: var(--pink-ink); font-size: 14px;
}

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 50px; padding: 0 22px; border-radius: 25px; border: 0;
  background: var(--pink); color: var(--on-pink); font-weight: 700; font-size: 17px;
}
.btn.quiet { background: var(--no-soft); color: var(--ink); }
a.btn { text-decoration: none; }
.btn:disabled { opacity: 0.45; cursor: default; }
.fab {
  position: fixed; z-index: 6; box-shadow: var(--shadow);
  right: calc(16px + env(safe-area-inset-right, 0px));
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  height: 58px; padding: 0 24px 0 18px; border-radius: 29px; font-size: 18px;
}
.fab svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 3; stroke-linecap: round; fill: none; }
.link { border: 0; background: transparent; padding: 8px 0; color: var(--pink-ink); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
:root .link.danger { color: var(--muted); }

/* Bottom sheet */
.scrim { position: fixed; inset: 0; z-index: 20; background: var(--scrim); }
.sheet {
  position: fixed; z-index: 21; left: 0; right: 0; bottom: 0;
  max-height: 88%; overflow-y: auto; overscroll-behavior: contain;
  background: var(--surface); border-radius: 22px 22px 0 0; box-shadow: var(--shadow);
  padding-top: 10px;
  padding-bottom: calc(22px + env(safe-area-inset-bottom, 0px));
  animation: rise 0.22s ease-out;
}
.sheet-inner {
  max-width: 560px; margin: 0 auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  display: grid; gap: 16px;
}
.grab { width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 6px; }
.sheet h2 { margin: 0; font-size: 26px; line-height: 1.15; text-wrap: balance; overflow-wrap: anywhere; }
.sheet .meta { margin: -10px 0 0; color: var(--muted); font-size: 15px; }
.sheet p { margin: 0; }
.field { display: grid; gap: 6px; }
.field label, .legend { font-size: 14px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.field input, .field textarea {
  width: 100%; border: 2px solid var(--line); border-radius: 12px; background: var(--bg);
  padding: 12px 14px; font-size: 19px;
}
.opt { text-transform: none; letter-spacing: 0; font-weight: 400; }
.check { display: flex; align-items: flex-start; gap: 12px; font-size: 16px; line-height: 1.4; cursor: pointer; }
.check input { width: 22px; height: 22px; margin: 1px 0 0; flex: none; accent-color: var(--pink); }
.where { display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 14px; }
.spot-cta { display: grid; gap: 6px; justify-items: start; }
.spot-cta .pin { width: 20px; height: 20px; }
.field textarea.short { min-height: 0; font-size: 14px; word-break: break-all; }
.field textarea { font-size: 15px; line-height: 1.5; resize: vertical; min-height: 180px; font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; }
.field input:focus, .field textarea:focus { outline: none; border-color: var(--pink); }
.inline { display: flex; gap: 10px; }
.inline input { flex: 1; min-width: 0; }
.inline .btn { flex: none; height: auto; padding: 0 18px; }
.hint { font-size: 15px; color: var(--muted); }
.good { font-size: 15px; color: var(--ink); background: var(--no-soft); border-left: 4px solid var(--ok); padding: 10px 12px; border-radius: 10px; }
.warn { font-size: 15px; color: var(--pink-ink); background: var(--pink-soft); padding: 10px 12px; border-radius: 10px; }
fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 10px; }
.choices { display: grid; gap: 10px; }
.choice {
  display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 10px 14px;
  border: 2px solid var(--line); border-radius: 14px; background: var(--surface);
  text-align: left; font-size: 18px; font-weight: 700;
}
.choice .packet { min-width: 66px; }
.choice .what { flex: 1; min-width: 0; }
.choice .what small { display: block; font-weight: 400; font-size: 14px; color: var(--muted); }
.choice[aria-pressed="true"] { border-color: var(--ink); }
.choice .now { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.actions .btn { flex: 1 1 140px; padding: 0 14px; white-space: nowrap; }
.confirm { display: grid; gap: 12px; padding: 14px; border-radius: 14px; background: var(--no-soft); }
.menu-item {
  display: flex; align-items: center; gap: 14px; width: 100%; min-height: 64px; padding: 10px 4px;
  border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left; font-size: 18px; font-weight: 700;
}
.menu-item small { display: block; font-weight: 400; font-size: 14px; color: var(--muted); }
.menu-item svg { width: 26px; height: 26px; flex: none; fill: none; stroke: var(--pink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

.steps { border-top: 1px solid var(--line); padding-top: 12px; font-size: 15px; }
.steps summary { cursor: pointer; font-weight: 700; color: var(--pink-ink); min-height: 32px; }
.steps ol { margin: 10px 0 0; padding-left: 22px; display: grid; gap: 8px; }

/* Toast */
.toast {
  position: fixed; z-index: 30;
  left: max(16px, env(safe-area-inset-left, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(88px + env(safe-area-inset-bottom, 0px));
  max-width: 528px; margin: 0 auto;
  display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 18px;
  background: var(--ink); color: var(--bg); border-radius: 14px; box-shadow: var(--shadow);
  font-size: 16px; animation: rise 0.18s ease-out;
}
.toast span { flex: 1; min-width: 0; }
.toast button { flex: none; border: 0; background: transparent; color: var(--bg); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; padding: 8px; }

@keyframes rise { from { transform: translateY(32px); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .sheet, .toast, .sync-line .dot, .here .pin { animation: none !important; } }
@media (min-width: 600px) { .brand span { font-size: 60px; } }

</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <h1 class="brand"><small>In search of</small><span>Pink</span></h1>
    <button id="menuBtn" class="icon-btn" type="button" aria-label="List options: share, send, import">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/></svg>
    </button>
  </header>
  <p class="sub">Which Fort Lauderdale restaurants have Sweet&rsquo;N Low in the sugar caddy</p>
  <div class="status-row">
    <button id="syncLine" class="sync-line" type="button" data-state="off" hidden><span class="dot" aria-hidden="true"></span><span id="syncText"></span></button>
    <button id="installBtn" class="install-pill" type="button" hidden>Install app</button>
  </div>
  <section id="here" class="here" aria-live="polite" aria-label="Where you are" hidden></section>
</div>

<div class="bar">
  <div class="wrap">
    <label class="search" for="q">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
      <input id="q" type="search" placeholder="Which restaurant?" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search" aria-label="Search restaurants">
      <button id="clearQ" class="clear" type="button" aria-label="Clear search" hidden>&times;</button>
    </label>
    <div class="filters" id="filters" aria-label="Show">
      <button class="chip" type="button" data-f="all" aria-pressed="true">All <b data-n="all">0</b></button>
      <button class="chip" type="button" data-f="pink" aria-pressed="false">Pink <b data-n="pink">0</b></button>
      <button class="chip" type="button" data-f="no" aria-pressed="false">No <b data-n="no">0</b></button>
      <button class="chip" type="button" data-f="unknown" aria-pressed="false">Not checked <b data-n="unknown">0</b></button>
    </div>
  </div>
</div>

<main class="wrap">
  <p id="storageNotice" class="notice" hidden>This window can&rsquo;t save changes, so anything you add or fix here disappears when you close it.</p>
  <ul id="list" class="list" aria-label="Restaurants"></ul>
  <div id="empty" class="empty" hidden></div>
</main>

<button id="addBtn" class="btn fab" type="button">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  Add restaurant
</button>

<div id="scrim" class="scrim" hidden></div>
<section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden></section>
<div id="toast" class="toast" role="status" aria-live="polite" hidden><span id="toastMsg"></span><button id="toastUndo" type="button">Undo</button></div>

<script>
(function () {
  'use strict';

  var KEY = 'inSearchOfPink.v1';
  var SYNC_KEY = 'inSearchOfPink.sync';
  var PEND_KEY = 'inSearchOfPink.pending';
  var ADDR_KEY = 'inSearchOfPink.addresses';

  // name, status, street address (Fort Lauderdale unless it says otherwise), other names it goes by
  var SEED = [
    ['Boathouse', 'no', '620 SE 4th St', ['Boathouse at the Riverside']],

  function hereTop(label, link) {

  function matchHtml(it, how) {

      '<p class="here-name">' + esc(it.name) + '</p>' +

  function renderHere() {
    if (!IS_APP || here.state === 'off') { hereEl.hidden = true; hereEl.innerHTML = ''; return; }

        '<div class="here-actions"><button type="button" class="btn" data-here="allow">' + PIN + 'Use my location</button></div>';
    } else if (s === 'locating') {
      kind = 'locating';
      h = hereTop('Finding where you are…');
    } else if (s === 'denied') {
      h = hereTop('Location is off') +
        '<p class="here-title">This app isn’t allowed to use your location.</p>' +
        '<p class="here-text">To turn it on, open <b>' + esc(location.host + location.pathname) + '</b> in Chrome, tap the icon to the left of the address, and allow Location. Until then, search below.</p>';

      } else if (g.kind === 'choose') {
        h = hereTop('You’re near') + '<p class="here-title">Which one are you at?</p>' + candList(g.cands) +
          '<div class="here-actions">' + hereLink('dismiss', 'None of these') + hereLink('again', 'Find me again') + '</div>';
      } else if (g.kind === 'fuzzy') {
        h = hereTop('Not sure where you are') +
          '<p class="here-title">Your location is only accurate to about ' + Math.round(g.acc / 50) * 50 + ' m right now.</p>' +

            : '<p class="here-text">That’s not close enough to tell which restaurant you’re in. Search below, or try again in a moment.</p>') +
          '<div class="here-actions">' + hereLink('again', 'Try again') + '</div>';
      } else if (g.kind === 'noplaces') {

  }
  function saveSpot(id) {

  /* Copy helper shared by the text-list and invite sheets */

      selectAll();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}

    return function () {
      if (navigator.clipboard && navigator.clipboard.writeText) {

        var v = input.value.trim();
        btn.disabled = !v;
        if (v && !validUrl(v) && /\/dev\/?$/.test(v)) { msg.hidden = false; msg.textContent = 'That is the test link. Use the Web app URL that ends in /exec.'; }
        else msg.hidden = true;
      });
      btn.addEventListener('click', function () {
        var v = input.value.trim();
        if (!validUrl(v)) {
          msg.hidden = false;
          msg.textContent = 'That doesn’t look like the Web app link. It starts with https://script.google.com/macros/s/ and ends in /exec.';
          return;
        }
        btn.disabled = true;
        btn.textContent = 'Connecting…';
        connect(v).then(function (r) {
          openSharedConnected(r.started
            ? 'The shared list is set up with ' + r.total + ' restaurants. Now invite the other phone.'
            : 'Connected. This phone now shows the shared list.' + (r.added ? ' ' + plural(r.added, 'restaurant') + ' from this phone ' + (r.added === 1 ? 'was' : 'were') + ' added to it.' : ''));
        }, function () {
          btn.disabled = false;
          btn.textContent = 'Connect';
          msg.hidden = false;
          msg.textContent = 'Couldn’t reach the shared list at that link. Check that you copied the whole Web app URL and that “Who has access” is set to Anyone.';
        });
      });
      return;
    }
    openSharedConnected();
  }
  function openSharedConnected(note) {
    var link = inviteLink(), canShare = typeof navigator.share === 'function';
    openSheet(
      '<h2 id="sheetTitle" tabindex="-1">Shared list</h2>' +
      '<p class="meta" id="sharedState">' + esc(sheetStateText()) + '</p>' +
      (note ? '<p class="good">' + esc(note) + '</p>' : '') +
      '<div class="field"><label for="inviteText">Invite another phone</label>' +
      '<textarea id="inviteText" class="short" readonly rows="3">' + esc(link) + '</textarea></div>' +
      '<p class="hint">Send this link to the other phone. Opening it in Chrome connects that phone; then use Chrome’s menu to install the app. Anyone with the link can change the list, so only send it to people you trust with it.</p>' +
      '<div class="actions">' + (canShare ? '<button type="button" class="btn" id="sendInvite">Send…</button>' : '') +
      '<button type="button" class="btn' + (canShare ? ' quiet' : '') + '" id="copyInvite">Copy link</button></div>' +
      '<p class="hint" id="inviteMsg" role="status"></p>' +
      '<div class="actions"><button type="button" class="btn quiet" id="syncNow">Sync now</button>' +
      (sync.sheetUrl ? '<a class="btn quiet" href="' + esc(sync.sheetUrl) + '" target="_blank" rel="noopener">Open the sheet</a>' : '') + '</div>' +
      '<div id="stopArea"><button type="button" class="link danger" id="stopBtn">Stop sharing on this phone</button></div>' +
      '<div><button type="button" class="link" data-act="close">Close</button></div>'
    );
    var ta = $('#inviteText', sheetEl), out = $('#inviteMsg', sheetEl);
    $('#copyInvite', sheetEl).addEventListener('click', wireCopy(link, ta, out, 'Link copied. Paste it into a text to the other phone.'));
    if (canShare) {
      $('#sendInvite', sheetEl).addEventListener('click', function () {
        navigator.share({ title: 'In Search of Pink', text: 'Join our pink-packet list: open this in Chrome, then install the app.', url: link })
          .catch(function (e) { if (!e || e.name !== 'AbortError') out.textContent = 'Sending didn’t work here. Use Copy link instead.'; });
      });
    }
    $('#syncNow', sheetEl).addEventListener('click', function () {
      var state = $('#sharedState', sheetEl);
      state.textContent = 'Syncing…';
      runSync().then(function () { if (state.isConnected) state.textContent = sheetStateText(); });
    });
    var area = $('#stopArea', sheetEl);
    $('#stopBtn', sheetEl).addEventListener('click', function () {
      var n = pending.length;
      area.innerHTML = '<div class="confirm"><p>Stop sharing on this phone? The list stays on this phone but stops updating.' +
        (n ? ' <strong>' + n + ' change' + (n === 1 ? ' hasn’t' : 's haven’t') + ' reached the shared list yet</strong> and will stay only on this phone.' : '') +
        '</p><div class="actions"><button type="button" class="btn" id="stopYes">Stop sharing</button>' +
        '<button type="button" class="btn quiet" id="stopNo">Keep sharing</button></div></div>';
      $('#stopYes', area).addEventListener('click', function () { disconnect(); closeSheet(); showToast('This phone has stopped sharing.', null); });
      $('#stopNo', area).addEventListener('click', function () { openSharedConnected(); });
    });
  }

  /* Text list */
  function shareText() {
    var groups = { pink: [], no: [], unknown: [] };
    sorted(items).forEach(function (it) { groups[it.status].push(it.name); });
    var out = 'In Search of Pink (' + fmt(todayISO()) + ')\nSweet’N Low in the sugar caddy, Fort Lauderdale\n';
    [['pink', 'PINK'], ['no', 'NO PINK'], ['unknown', 'NOT CHECKED']].forEach(function (g) {
      if (groups[g[0]].length) out += '\n' + g[1] + '\n' + groups[g[0]].join('\n') + '\n';
    });
    return out.trim();
  }
  function openShare() {
    var text = shareText();
    var canShare = typeof navigator.share === 'function';
    openSheet(
      '<h2 id="sheetTitle" tabindex="-1">Send the list as text</h2>' +
      '<p class="meta">Send it in a text or email, or keep it as a backup. Import copies it into the app on another phone.</p>' +
      '<div class="field"><label for="shareText">The list as text</label>' +
      '<textarea id="shareText" readonly rows="12">' + esc(text) + '</textarea></div>' +
      '<div class="actions">' + (canShare ? '<button type="button" class="btn" id="sendBtn">Send…</button>' : '') +
      '<button type="button" class="btn' + (canShare ? ' quiet' : '') + '" id="copyBtn">Copy</button></div>' +
      '<p class="hint" id="shareMsg" role="status"></p>' +
      '<div><button type="button" class="link" data-act="close">Close</button></div>'
    );
    var ta = $('#shareText', sheetEl), out = $('#shareMsg', sheetEl);
    $('#copyBtn', sheetEl).addEventListener('click', wireCopy(text, ta, out, 'Copied. Paste it into a text or email.'));
    if (canShare) {
      $('#sendBtn', sheetEl).addEventListener('click', function () {
        navigator.share({ title: 'In Search of Pink', text: text }).catch(function (e) {
          if (!e || e.name !== 'AbortError') out.textContent = 'Sending didn’t work here. Use Copy instead.';
        });
      });
    }
  }

  /* Import */
  function statusWord(w) {
    w = norm(w);
    if (w === 'pink' || w === 'yes' || w === 'has pink') return 'pink';
    if (w === 'no' || w === 'no pink' || w === 'none') return 'no';
    if (w === 'not checked' || w === 'not checked yet' || w === 'unknown' || w === '') return 'unknown';
    return null;
  }
  function parseList(text) {
    var out = [], current = null;
    String(text || '').split(/\r?\n/).forEach(function (line) {
      var t = line.replace(/ /g, ' ').trim();
      if (!t) return;
      var h = norm(t);
      if (/^in search of pink/.test(h) || /^sweet ?n low in the/.test(h)) return;
      var header = statusWord(t.replace(/:$/, ''));
      if (header && h) { current = header; return; }
      t = t.replace(/^[-•*·]\s+/, '').replace(/^\d+[.)]\s+/, '');
      var status = current;
      if (!current) {
        var m = t.match(/^(.*?)[\s\-–—:,|]+(no pink|not checked|pink|yes|no|\?)\s*$/i);
        if (m && m[1].trim()) { t = m[1]; status = m[2] === '?' ? 'unknown' : statusWord(m[2]); }
      }
      var name = tidy(t.replace(/[.\s]+$/, ''));
      if (name && norm(name)) out.push({ name: name, status: status || 'unknown' });
    });
    return out;
  }
  function openImport() {
    openSheet(
      '<h2 id="sheetTitle" tabindex="-1">Import a list</h2>' +
      '<p class="meta">Paste a list sent from this app. Restaurants you already have get their answer updated, new ones are added, and nothing is removed.</p>' +
      '<div class="field"><label for="importText">Paste the list here</label>' +
      '<textarea id="importText" rows="10" placeholder="PINK&#10;Doc B’s&#10;Tap 42&#10;&#10;NO PINK&#10;Boathouse"></textarea></div>' +
      '<p class="hint" id="importMsg" role="status">Nothing pasted yet.</p>' +
      '<div class="actions"><button type="button" class="btn" id="doImport" disabled>Import</button>' +
      '<button type="button" class="btn quiet" data-act="close">Cancel</button></div>',
      '#importText'
    );
    var ta = $('#importText', sheetEl), out = $('#importMsg', sheetEl), btn = $('#doImport', sheetEl);
    function preview() {
      var parsed = parseList(ta.value), c = { pink: 0, no: 0, unknown: 0 };
      parsed.forEach(function (p) { c[p.status]++; });
      btn.disabled = !parsed.length;
      out.textContent = parsed.length
        ? 'Found ' + plural(parsed.length, 'restaurant') + ': ' + c.pink + ' pink, ' + c.no + ' no pink, ' + c.unknown + ' not checked.'
        : (ta.value.trim() ? 'No restaurants found in that text.' : 'Nothing pasted yet.');
    }
    ta.addEventListener('input', preview);
    btn.addEventListener('click', function () {
      var parsed = parseList(ta.value), before = snap(), added = 0, changed = 0;
      parsed.forEach(function (p) {
        var ex = findByName(p.name);
        if (ex) {
          if (p.status !== 'unknown' && ex.status !== p.status) { ex.status = p.status; ex.updated = todayISO(); changed++; }
        } else {
          items.push(copyItem({ id: uid(), name: p.name, status: p.status, updated: todayISO(), address: knownAddress(p.name) }));
          added++;
        }
      });
      closeSheet();
      if (!added && !changed) { showToast('Your list already matches.', null); return; }
      filter = 'all';
      commit('Imported: ' + added + ' added, ' + changed + ' updated.', before);
    });
  }

  /* ---------- events ---------- */
  listEl.addEventListener('click', function (e) {
    var row = e.target.closest('.row');
    if (row) openEdit(row.getAttribute('data-id'));
  });
  emptyEl.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b) return;
    var act = b.getAttribute('data-act');
    if (act === 'showall') { filter = 'all'; render(); }
    if (act === 'addq') openAdd(tidy(qEl.value));
  });
  sheetEl.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b) return;
    var act = b.getAttribute('data-act');
    if (act === 'close') closeSheet();
    else if (act === 'share') openShare();
    else if (act === 'import') openImport();
    else if (act === 'shared') openShared();
    else if (act === 'edit') openEdit(b.getAttribute('data-id'));
  });
  scrimEl.addEventListener('click', function () { closeSheet(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && sheetOpen) closeSheet(); });

  $('#filters').addEventListener('click', function (e) {
    var c = e.target.closest('.chip');
    if (!c) return;
    filter = c.getAttribute('data-f');
    render();
  });
  qEl.addEventListener('input', function () {
    var v = qEl.value.trim();
    if (v && !prevQuery) filter = 'all';
    prevQuery = v;
    render();
  });
  qEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); qEl.blur(); } });
  $('#clearQ').addEventListener('click', function () { qEl.value = ''; prevQuery = ''; render(); qEl.focus(); });
  $('#addBtn').addEventListener('click', function () { openAdd(''); });
  $('#menuBtn').addEventListener('click', openMenu);
  $('#syncLine').addEventListener('click', function () {
    if (sync.url && (syncState === 'error' || syncState === 'offline')) runSync();
    openShared();
  });

  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    installEvent = e;
    $('#installBtn').hidden = false;
  });
  window.addEventListener('appinstalled', function () { $('#installBtn').hidden = true; installEvent = null; });
  $('#installBtn').addEventListener('click', function () {
    if (!installEvent) return;
    installEvent.prompt();
    installEvent.userChoice.then(function () { installEvent = null; $('#installBtn').hidden = true; }, function () {});
  });

  /* ---------- start ---------- */
  items = load();
  loadSync();
  if (sync.url) syncState = navigator.onLine === false ? 'offline' : 'busy';
  else fillAddresses('local');
  render();
  initHere();

  function joinFromLink() {
    var h = location.hash;
    if (h.indexOf('#join=') !== 0) return null;
    var u = '';
    try { u = decodeURIComponent(h.slice(6)); } catch (e) {}
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    return validUrl(u) ? u.replace(/\/$/, '') : '';
  }
  function handleJoin() {
    var join = IS_APP ? joinFromLink() : null;
    if (join === '') {
      showToast('That invite link is incomplete. Ask for it again.', null);
      runSync();
    } else if (join && join !== sync.url) {
      closeSheet();
      setSyncState('busy');
      connect(join).then(function (r) {
        showToast(r.started ? 'The shared list is set up.' : 'You’re on the shared list.', null);
      }, function () {
        setSyncState(sync.url ? 'error' : 'off');
        openShared('Couldn’t reach the shared list from that invite link. Check your connection, then open the link again.');
      });
    } else {
      runSync();
    }
  }
  handleJoin();
  // An invite link opened while the app is already showing arrives as a hash change, not a new page.
  window.addEventListener('hashchange', function () { if (location.hash.indexOf('#join=') === 0) handleJoin(); });

  if (IS_APP) {
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState !== 'visible') return;
      runSync();
      // Back in the app after a while? You may be somewhere new.
      if (here.granted && here.state !== 'locating' && Date.now() - here.started > 90000) startLocate();
    });
    window.addEventListener('online', function () { runSync(); });
    window.addEventListener('offline', function () { if (sync.url) setSyncState('offline'); });
    setInterval(function () { if (document.visibilityState === 'visible') runSync(); }, 45000);
  }

  var secure = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if (IS_APP && secure && 'serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () {}); });
  }
  if (IS_APP) {
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {}); } catch (e) {}
  }

  window.__pink = {
    parseList: parseList,
    get items() { return items; },
    get pending() { return pending; },
    get state() { return syncState; },
    get here() { return here.state; },
    sync: runSync,
    locate: startLocate
  };
})();

</script>
</body>
</html>
